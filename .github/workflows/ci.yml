name: Review 2082 full Linux validation
on:
  push:
    branches:
      - validate/review-2082-full
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENCODE2_VERSION: 2.0.29
  OPENCODE2_LINUX_X64_SHA256: 14b5a6638a1a093ac9d484599c844b10c29b445d04844b682ccc668ce26530a2
jobs:
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node-version }} on ubuntu-latest)
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Install bubblewrap and let it make user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # A WSL-style drive under /mnt, which a step must never see.
          sudo mkdir -p /mnt/c/Windows/System32
          bwrap --version
      - name: Unit tests
        run: npx vitest run
        env:
          REQUIRE_NATIVE_SANDBOX: "1"
  prepare-build:
    name: Prepare build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: OpenCode recall E2E
        run: npx vitest run --config vitest.e2e.config.ts
          src/__tests__/e2e/opencode-recall.test.ts
      - name: Unattended init E2E
        run: npx vitest run --config vitest.e2e.config.ts
          src/__tests__/e2e/init-unattended.test.ts
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  build:
    name: Build
    needs:
      - lint-and-test
      - prepare-build
    runs-on: ubuntu-latest
    steps:
      - name: Confirm build and unit matrix passed
        run: echo "Build and unit test matrix passed."
  fork-e2e-shard:
    name: E2E (fork-safe, no credentials, shard ${{ matrix.shard }}/3)
    needs: prepare-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install OpenCode 2
        run: |
          dir="$RUNNER_TEMP/opencode2"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/cli.tgz" "https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-$OPENCODE2_VERSION.tgz"
          echo "$OPENCODE2_LINUX_X64_SHA256  $dir/cli.tgz" | sha256sum -c -
          tar -xzf "$dir/cli.tgz" -C "$dir"
          "$dir/package/bin/opencode" --version
          echo "TEAMAI_OPENCODE_V2_BIN=$dir/package/bin/opencode" >> "$GITHUB_ENV"
      - name: Run E2E (no remote credentials)
        run: npx vitest run --config vitest.e2e.config.ts --shard=${{ matrix.shard }}/3
  fork-e2e:
    name: E2E (fork-safe, no credentials)
    needs: fork-e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every E2E shard passed
        run: test "${{ needs.fork-e2e-shard.result }}" = success
  review-world:
    name: Official world baseline and fixed CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reproduce failure and verify fixed packed CLI in official worlds
        run: |-
          node --input-type=module <<'WORLD_JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          const checker = "import assert from 'node:assert/strict';\r\nimport fs from 'node:fs/promises';\r\nimport os from 'node:os';\r\nimport path from 'node:path';\r\nimport {spawnSync} from 'node:child_process';\r\n\r\nconst root = process.cwd();\nconst env = process.env;\nconst run = args => {\r\n const r = spawnSync('teamai',args,{cwd:root,env,windowsHide:true,encoding:'utf8',timeout:15000});\r\n if(r.error) throw r.error;\r\n return {command:args.join(' '),status:r.status,stdout:r.stdout.trim(),stderr:r.stderr.trim()};\r\n};\r\nconst results=[];\r\nfor(const args of [['review','missing','--apply'],['review','missing','--apply','--json']]) {\r\n const r=run(args); assert.match(r.stdout+r.stderr,/not found/);results.push(r);\r\n}\r\nconst docs=path.join(root,'docs');\r\nconst queued=run(['import','write-sections','--source','iwiki://123','--reply',JSON.stringify({glossary:'PROBE_GLOSSARY'}),'--sections-dir',docs,'--review-dir',root,'--review','true']);\r\nassert.equal(queued.status,0,JSON.stringify(queued));\r\nconst queue=path.join(root,'.teamai/pending-review.jsonl');\r\nconst before=await fs.readFile(queue,'utf8');\r\nconst item=JSON.parse(before.trim());\r\nfor(const args of [\r\n ['review',item.id,'--apply'],['review',item.id,'--apply','--json'],\r\n ['review','--all-apply','--max-risk','high'],['review','--all-apply','--max-risk','high','--json']\r\n]) {\r\n const r=run(args);assert.match(r.stdout+r.stderr,/target file not found|1 failed/);results.push(r);\r\n}\r\nassert.equal(await fs.readFile(queue,'utf8'),before);\r\nassert.equal(await fs.stat(path.join(docs,'external-knowledge.md')).then(()=>true,()=>false),false);\r\nassert.equal(results.length,6);\r\nawait fs.writeFile(path.join(root,'approval-statuses.json'),JSON.stringify(results,null,2));\nassert(results.every(r=>r.status===1),'A refused approval must exit 1');\r\nconst direct = run(['import','write-sections','--source','iwiki://123','--reply',JSON.stringify({glossary:'EXISTING_GLOSSARY'}),'--sections-dir',docs,'--review-dir',root,'--review','false']);\r\nassert.equal(direct.status,0,JSON.stringify(direct));\r\nconst success = run(['review',item.id,'--apply','--json']);\r\nassert.equal(success.status,0,JSON.stringify(success));\r\nassert.equal(JSON.parse(success.stdout).ok,true);\r\nconst empty = run(['review','--all-apply','--json']);\r\nassert.equal(empty.status,0,JSON.stringify(empty));\r\nassert.equal(JSON.parse(empty.stdout).results.length,0);\r\nconst report={base:'758b536157207d967964a600c30365462c4b90c2',queueUnchanged:true,externalKnowledgeAbsent:true,failuresExitOne:results,success,emptyBatch:empty};\r\nawait fs.writeFile(path.join(root,'review-fixed-results.json'),JSON.stringify(report,null,2));\r\nconsole.log(JSON.stringify(report,null,2));\r\n";
          const candidate = process.cwd();
          const evidence = path.join(process.env.RUNNER_TEMP,'review-world-evidence');
          fs.mkdirSync(evidence,{recursive:true});
          const run = (cwd, bin, args) => {
            const r=spawnSync(bin,args,{cwd,encoding:'utf8',timeout:1200000,maxBuffer:64*1024*1024});
            if(r.error) throw r.error;
            return r;
          };
          const requireOK = (cwd,bin,args) => {
            const r=run(cwd,bin,args); process.stdout.write(r.stdout); process.stderr.write(r.stderr);
            assert.equal(r.status,0,bin+' '+args.join(' ')); return r;
          };
          const baseline=path.join(process.env.RUNNER_TEMP,'review-baseline');
          requireOK(candidate,'git',['worktree','add','--detach',baseline,'758b536157207d967964a600c30365462c4b90c2']);
          requireOK(baseline,'npm',['ci','--ignore-scripts']);
          for(const [label,cwd,expected] of [['baseline',baseline,1],['candidate',candidate,0]]) {
            const dir=path.join(evidence,label); fs.mkdirSync(dir,{recursive:true});
            const made=requireOK(cwd,'node',['scripts/verify.mjs','world']);
            fs.writeFileSync(path.join(dir,'creation.log'),made.stdout+made.stderr);
            const id=made.stdout.trim().split(/\r?\n/).at(-1);
            assert.match(id,/^\d{8}T\d{6}-[0-9a-f]{6}$/);
            const location=requireOK(cwd,'node',['scripts/verify.mjs','dir',id]).stdout.trim();
            const result=run(cwd,'node',['scripts/verify.mjs','sh',id,'node','--input-type=module','-e',checker]);
            process.stdout.write(result.stdout); process.stderr.write(result.stderr);
            fs.writeFileSync(path.join(dir,'probe.log'),result.stdout+result.stderr);
            fs.writeFileSync(path.join(dir,'probe-status.json'),JSON.stringify({label,status:result.status,expected}));
            const world=JSON.parse(fs.readFileSync(path.join(location,'world.json'),'utf8'));
            for(const name of ['approval-statuses.json','review-fixed-results.json']) {
              const source=path.join(world.project,name); if(fs.existsSync(source)) fs.copyFileSync(source,path.join(dir,name));
            }
            const ledger=run(cwd,'node',['scripts/verify.mjs','ledger',id]);
            process.stdout.write(ledger.stdout); process.stderr.write(ledger.stderr);
            fs.writeFileSync(path.join(dir,'ledger.log'),ledger.stdout+ledger.stderr);
            const cleanup=run(cwd,'node',['scripts/verify.mjs','cleanup',id]);
            process.stdout.write(cleanup.stdout); process.stderr.write(cleanup.stderr);
            fs.writeFileSync(path.join(dir,'cleanup.log'),cleanup.stdout+cleanup.stderr);
            for(const name of fs.readdirSync(location)) {
              if(name==='world.json'||name==='logs'||name==='observed.jsonl'||/^LEDGER-/.test(name)) fs.cpSync(path.join(location,name),path.join(dir,name),{recursive:true});
            }
            assert.equal(result.status,expected,label+' world probe result');
            const statuses=JSON.parse(fs.readFileSync(path.join(dir,'approval-statuses.json'),'utf8'));
            assert.equal(statuses.length,6);
            assert(statuses.every(r=>r.status===(label==='baseline'?0:1)),'all six approval forms reproduce the intended behavior');
            assert.equal(ledger.status,0,label+' ledger');
            assert.equal(cleanup.status,0,label+' cleanup');
          }
          console.log('Official world pair: baseline FAILED on exit-code assertion; candidate VERIFIED; both ledgers clean.');
          WORLD_JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-world-evidence
          path: ${{ runner.temp }}/review-world-evidence
          if-no-files-found: error
permissions:
  contents: read
